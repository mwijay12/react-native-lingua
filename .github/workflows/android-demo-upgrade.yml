# Temporary compatibility check for the previously delivered demo.
name: Android demo upgrade test
on:
  push:
    branches: ["arena/aa8896d6-react-native-lingua"]
    paths: [".github/workflows/android-demo-upgrade.yml"]
permissions:
  actions: read
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Get previous APK
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: old-demo
          run-id: 43218864565
          github-token: ${{ github.token }}
      - name: Get updated APK
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: new-demo
          run-id: 43686552671
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install old demo and update in place
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/smoke-android-upgrade.py old-demo/Lingua-Demo.apk new-demo/Lingua-Demo.apk
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Demo-Upgrade-Diagnostics
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 1
