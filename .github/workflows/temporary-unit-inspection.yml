name: Temporary native validation

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/temporary-unit-inspection.yml"]

permissions:
  actions: read
  contents: read

jobs:
  upgrade:
    name: Check in-place upgrade with existing APKs
