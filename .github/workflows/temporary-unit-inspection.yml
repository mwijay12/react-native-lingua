name: Temporary Android diagnostic

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/temporary-unit-inspection.yml"]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve diagnostic APK build output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view 44695453427 --job 136151018062 --log > "$RUNNER_TEMP/spacing.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'spacing.log').read_text(errors='replace').splitlines()
          lines = [line for line in lines if 'Make a test-only APK with the new JS bundle' in line]
          text = '\n'.join(lines[-80:])[-18000:]
          for index in range(0, len(text), 2400):
              chunk = text[index:index+2400].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Spacing diagnostic {index//2400:02d}::{chunk}')
          PY
