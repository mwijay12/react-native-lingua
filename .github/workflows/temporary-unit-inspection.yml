      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: baseline
          run-id: 44653269194
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: current
          run-id: 44674923975
          github-token: ${{ github.token }}
      - name: Verify both APK checksums
        run: |
          for dir in baseline current; do
            expected="$(awk 'NR == 1 {print $1}' "$dir/SHA256SUMS.txt")"
            actual="$(sha256sum "$dir/Lingua-Demo.apk" | awk '{print $1}')"
            test -n "$expected" && test "$actual" = "$expected"
          done
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade synthetic learner offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 -u scripts/smoke-android-p0-upgrade.py baseline/Lingua-Demo.apk current/Lingua-Demo.apk > "$GITHUB_WORKSPACE/upgrade.log" 2>&1
      - name: Report upgrade result
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upgrade.log')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else ['No emulator test log.']
          text = '\n'.join(lines[-30:])[-9500:]
          for i in range(0, len(text), 2400):
              s = text[i:i+2400].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Upgrade report {i//2400:02d}::{s}')
          PY
      - name: Save isolated upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-upgrade-diagnostics
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 1

  inspect:
    name: Report current emulator checks
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Wait for current Android smoke checks and summarize
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run watch 44674923975 --exit-status --interval 30 > "$RUNNER_TEMP/watch.log" 2>&1 || true
          for job in 136089917343 136089917352 136089917432; do
            gh run view 44674923975 --job "$job" --log > "$RUNNER_TEMP/$job.log" || true
          done
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for job in ('136089917343', '136089917352', '136089917432'):
              p = root / f'{job}.log'
              lines = p.read_text(errors='replace').splitlines() if p.exists() else []
              selected = [line for line in lines if re.search(r'sw-unit-\d:|smoke passed|Traceback|AssertionError|RuntimeError|FATAL EXCEPTION|error:|##\[error\]', line, re.I)]
              if not selected:
                  selected = lines[-15:]
              text = '\n'.join(selected)[-15000:]
              for i in range(0, len(text), 2400):
                  s = text[i:i+2400].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=Smoke {job} {i//2400:02d}::{s}')
          PY
