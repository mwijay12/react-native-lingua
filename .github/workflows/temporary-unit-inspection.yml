name: Temporary native spacing validation

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/temporary-unit-inspection.yml"]

permissions:
  actions: read
  contents: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  EXPO_OFFLINE: "1"

jobs:
  spacing:
    name: Verify updated JavaScript on isolated Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare the same demo and bundle current JavaScript
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run harden-storage
          node scripts/prepare-android-demo.mjs
          cd .expo/android-demo
          ./node_modules/.bin/expo prebuild --platform android --no-install
          mkdir -p "$GITHUB_WORKSPACE/diagnostic/assets" "$GITHUB_WORKSPACE/diagnostic/res"
          ./node_modules/.bin/expo export:embed --entry-file node_modules/expo-router/entry.js --platform android --dev false --minify false --bundle-output "$GITHUB_WORKSPACE/diagnostic/assets/index.android.bundle" --assets-dest "$GITHUB_WORKSPACE/diagnostic/res" --bytecode
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: previous
          run-id: 44674923975
          github-token: ${{ github.token }}
      - name: Make a test-only APK with the new JS bundle
        run: |
          expected="$(awk 'NR == 1 {print $1}' previous/SHA256SUMS.txt)"
          actual="$(sha256sum previous/Lingua-Demo.apk | awk '{print $1}')"
          test -n "$expected" && test "$actual" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          import zlib
          source = Path('previous/Lingua-Demo.apk')
          bundle = Path('diagnostic/assets/index.android.bundle')
          with ZipFile(source) as original, ZipFile('diagnostic-unsigned.apk', 'w') as updated:
              names = set(original.namelist())
              assert 'assets/index.android.bundle' in names, 'Expected release JS bundle'
              for asset in Path('diagnostic/res/raw').glob('assets_audio_*'):
                  data = asset.read_bytes()
                  matches = [info for info in original.infolist() if info.file_size == len(data) and info.CRC == zlib.crc32(data)]
                  assert any(original.read(info.filename) == data for info in matches), f'Missing or changed audio asset {asset.name}'
              for info in original.infolist():
                  upper = info.filename.upper()
                  signature = upper == 'META-INF/MANIFEST.MF' or (upper.startswith('META-INF/') and upper.endswith(('.SF', '.RSA', '.DSA', '.EC')))
                  if signature or info.filename == 'assets/index.android.bundle':
                      continue
                  updated.writestr(info, original.read(info.filename))
              info = ZipInfo('assets/index.android.bundle')
              info.compress_type = ZIP_STORED
              updated.writestr(info, bundle.read_bytes())
          print('Reused matching native resources and replaced only the generated JS bundle.')
          PY
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/zipalign" -p -f 4 diagnostic-unsigned.apk diagnostic-aligned.apk
          "$TOOLS/apksigner" sign --ks .expo/android-demo/android/app/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out diagnostic.apk diagnostic-aligned.apk
          "$TOOLS/apksigner" verify --verbose diagnostic.apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure every Kiswahili unit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: LINGUA_SYNTHETIC_EMULATOR=1 python3 -u scripts/smoke-android-motion.py diagnostic.apk > "$GITHUB_WORKSPACE/spacing.log" 2>&1
      - name: Report measured spacing
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('spacing.log')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else ['No spacing test log.']
          selected = [line for line in lines if 'sw-unit-' in line or 'smoke passed' in line or 'Error' in line or 'Traceback' in line]
          if not selected:
              selected = lines[-20:]
          text = '\n'.join(selected)[-9500:]
          for i in range(0, len(text), 2400):
              s = text[i:i+2400].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Spacing report {i//2400:02d}::{s}')
          PY
      - name: Save isolated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-spacing-diagnostics
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 1
