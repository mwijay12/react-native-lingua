name: Temporary Android build diagnostics

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/temporary-unit-inspection.yml"]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve failed build diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view 44674207797 --job 136082034138 --log > "$RUNNER_TEMP/android-build.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'android-build.log').read_text(errors='replace').splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if re.search(r'failure|failed|error|what went wrong|could not|caused by|exception|unresolved', line, re.I):
                  selected.update(range(max(0, i - 2), min(len(lines), i + 7)))
          text = '\n'.join(lines[i] for i in sorted(selected))[-22000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::notice title=Android build diagnostic::{text}')
          PY
