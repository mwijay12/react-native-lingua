name: Temporary Android build diagnostics

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/temporary-unit-inspection.yml"]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe public Maven metadata
        run: |
          for url in \
            'https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.9.1/gson-2.9.1.pom' \
            'https://repo1.maven.org/maven2/com/google/code/gson/gson/2.9.1/gson-2.9.1.pom' \
            'https://plugins.gradle.org/m2/com/google/code/gson/gson/2.9.1/gson-2.9.1.pom'; do
            status=$(curl -L -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)
            echo "::notice title=Maven probe::$url $status"
          done
      - name: Retrieve failed build diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view 44674207797 --job 136082971429 --log > "$RUNNER_TEMP/android-build.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'android-build.log').read_text(errors='replace').splitlines()
          lines = [line for line in lines if 'Assemble bundled test APK' in line]
          text = '\n'.join(lines[-100:])[-21000:]
          chunks = [text[i:i + 2500] for i in range(0, len(text), 2500)]
          for index, chunk in enumerate(chunks):
              chunk = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Android build diagnostic {index:02d}::{chunk}')
          PY
