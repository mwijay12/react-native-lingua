name: Retest Android demo

# Temporary: retest the existing APK after an emulator-launcher interruption.
on:
  push:
    branches: ["arena/6801c5e3-react-native-lingua"]
    paths: [".github/workflows/android-rerun.yml"]

permissions:
  actions: read
  contents: write

jobs:
  smoke:
    name: Retest Android lessons and study tools
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download built demo
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: new-apk
          run-id: 43715956070
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the demo on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p android-smoke
            bash -o pipefail -c 'python3 scripts/smoke-android-demo.py new-apk/Lingua-Demo.apk 2>&1 | tee android-smoke/run.log'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Demo-Retest-Diagnostics
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 3
      - name: Stage temporary diagnostic manifest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          entries = []
          for file in sorted(Path('android-smoke').rglob('*')):
              if not file.is_file():
                  continue
              data = file.read_bytes()
              payload = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode()
              sha = subprocess.run(
                  ['gh', 'api', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '--input', '-', '--jq', '.sha'],
                  input=payload, stdout=subprocess.PIPE, check=True,
              ).stdout.decode().strip()
              assert sha == hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              entries.append({'name': str(file.relative_to('android-smoke')), 'sha': sha, 'size': len(data)})
          Path('.arena-rerun-debug.json').write_text(json.dumps(entries, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .arena-rerun-debug.json
          git commit -m 'Stage temporary Android retest diagnostics'
          git push origin HEAD:arena/6801c5e3-react-native-lingua
