name: Android demo APK

on:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/android-demo.yml"
      - "app/**"
      - "assets/**"
      - "components/**"
      - "constants/**"
      - "data/**"
      - "hooks/**"
      - "demo/android/**"
      - "lib/**"
      - "patches/**"
      - "plugins/**"
      - "scripts/harden-async-storage.cjs"
      - "scripts/prepare-android-demo.mjs"
      - "scripts/smoke-android-*.py"
      - "store/**"
      - "tests/**"
      - "types/**"
      - "package*.json"
      - "*.config.js"
      - "global.css"
      - "tsconfig.json"
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: "Optional run ID containing the Lingua-Demo-APK baseline for an isolated in-place upgrade test"
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  apk:
    name: Build installable test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install project dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Apply and verify native storage safeguards
        run: npm run harden-storage
      - name: Validate source and lesson content
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Prepare isolated demo project
        run: node scripts/prepare-android-demo.mjs
      - name: Generate Android project
        working-directory: .expo/android-demo
        env:
          EXPO_OFFLINE: "1"
        run: ./node_modules/.bin/expo prebuild --platform android --no-install
      - name: Assemble bundled test APK
        working-directory: .expo/android-demo/android
        env:
          EXPO_OFFLINE: "1"
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Collect APK and verify signature
        run: |
          mkdir -p artifacts
          cp .expo/android-demo/android/app/build/outputs/apk/release/app-release.apk artifacts/Lingua-Demo.apk
          sha256sum artifacts/Lingua-Demo.apk | tee artifacts/SHA256SUMS.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/Lingua-Demo.apk
          "$BUILD_TOOLS/aapt" dump badging artifacts/Lingua-Demo.apk > artifacts/APK-info.txt
          "$BUILD_TOOLS/aapt" dump permissions artifacts/Lingua-Demo.apk > artifacts/APK-permissions.txt
          if grep -Fq 'android.permission.RECORD_AUDIO' artifacts/APK-permissions.txt; then
            echo 'Playback-only demo must not request microphone permission.' >&2
            exit 1
          fi
          echo 'Verified: the built APK does not request RECORD_AUDIO.'
          sed -n '1,25p' artifacts/APK-info.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 3

  smoke-test:
    name: Android emulator smoke test
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: artifacts
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, open and navigate the demo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            LINGUA_SYNTHETIC_EMULATOR=1 python3 scripts/smoke-android-motion.py artifacts/Lingua-Demo.apk
            python3 scripts/smoke-android-demo.py artifacts/Lingua-Demo.apk
      - name: Upload smoke-test screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Demo-Android-Smoke
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 3

  planning-smoke-test:
    name: Offline days and plans smoke test
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: artifacts
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Practise the new lessons offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/smoke-android-planning.py artifacts/Lingua-Demo.apk
      - name: Upload planning screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Demo-Planning-Smoke
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 3

  storage-fault-test:
    name: Android storage-failure safety
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: artifacts
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inject faults into synthetic demo storage only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/smoke-android-storage-failures.py artifacts/Lingua-Demo.apk
      - name: Upload fault-test screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Demo-Storage-Smoke
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 3

  p0-upgrade-test:
    name: Isolated P0 in-place upgrade
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_run_id != '' }}
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: artifacts
      - name: Download explicitly selected baseline APK
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: baseline
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
      - name: Verify baseline artifact checksum
        run: |
          expected="$(awk 'NR == 1 {print $1}' baseline/SHA256SUMS.txt)"
          actual="$(sha256sum baseline/Lingua-Demo.apk | awk '{print $1}')"
          test -n "$expected" && test "$actual" = "$expected"
          echo "Baseline SHA-256: $actual"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade a synthetic learner without clearing after installation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/smoke-android-p0-upgrade.py baseline/Lingua-Demo.apk artifacts/Lingua-Demo.apk
      - name: Upload upgrade screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Demo-P0-Upgrade
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 3
