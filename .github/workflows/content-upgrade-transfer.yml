name: Temporary content upgrade and APK handoff

on:
  push:
    branches:
      - "arena/85f2bc67-react-native-lingua"
    paths:
      - ".github/workflows/content-upgrade-transfer.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  upgrade:
    name: Upgrade the previous demo in place
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download previous Quick Mix demo
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: baseline
          run-id: 43792279548
          github-token: ${{ github.token }}
      - name: Download new demo
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: current
          run-id: 44017008826
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installation and progress upgrade offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/smoke-android-content-upgrade.py baseline/Lingua-Demo.apk current/Lingua-Demo.apk
      - name: Upload upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Content-Upgrade-Diagnostics
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 3

  handoff:
    name: Temporarily stage the verified APK
    needs: upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/85f2bc67-react-native-lingua
          fetch-depth: 0
      - name: Require the fresh-install Android smoke test to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 44017008826 --exit-status --interval 30
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: current
          run-id: 44017008826
          github-token: ${{ github.token }}
      - name: Split compressed APK and create checksums
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, shutil
          from pathlib import Path
          src = Path('current/Lingua-Demo.apk')
          output = Path('.apk-transfer')
          output.mkdir(exist_ok=True)
          packed = Path('lingua-transfer.apk.gz')
          with src.open('rb') as input_file, gzip.open(packed, 'wb', compresslevel=1) as compressed:
              shutil.copyfileobj(input_file, compressed)
          digest = lambda file: hashlib.sha256(file.read_bytes()).hexdigest()
          expected = Path('current/SHA256SUMS.txt').read_text().split()[0]
          if digest(src) != expected:
              raise RuntimeError('APK differs from the checksum produced during the build')
          permissions = Path('current/APK-permissions.txt').read_text()
          if 'android.permission.RECORD_AUDIO' in permissions:
              raise RuntimeError('Playback-only APK must not request microphone permission')
          (output / 'APK-permissions.txt').write_text(permissions)
          parts = []
          with packed.open('rb') as stream:
              for index in range(100):
                  chunk = stream.read(8 * 1024 * 1024)
                  if not chunk:
                      break
                  file = output / f'part-{index:02d}'
                  file.write_bytes(chunk)
                  parts.append({'name': file.name, 'size': len(chunk), 'sha256': hashlib.sha256(chunk).hexdigest()})
          manifest = {'source_run': 44017008826, 'apk_size': src.stat().st_size, 'apk_sha256': digest(src),
                      'gzip_size': packed.stat().st_size, 'gzip_sha256': digest(packed), 'parts': parts}
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Stage chunks on the approved session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/85f2bc67-react-native-lingua
          git add .apk-transfer
          git commit -m 'Temporarily stage tested demo APK'
          git push origin HEAD:arena/85f2bc67-react-native-lingua
