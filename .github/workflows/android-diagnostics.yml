name: Collect Android test diagnostics

# Temporary branch-scoped troubleshooting for the demo emulator run.
on:
  push:
    branches: ["arena/6801c5e3-react-native-lingua"]
    paths: [".github/workflows/android-diagnostics.yml"]

permissions:
  actions: read
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download smoke diagnostics
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-Android-Smoke
          path: smoke
          run-id: 43715956070
          github-token: ${{ github.token }}
      - name: Capture failure log and stage diagnostic blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 43715956070 --repo "$GITHUB_REPOSITORY" --job 132821328250 --log-failed > smoke/failed-job.log
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path

          entries = []
          for file in sorted(Path('smoke').rglob('*')):
              if not file.is_file():
                  continue
              data = file.read_bytes()
              payload = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode()
              sha = subprocess.run(
                  ['gh', 'api', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '--input', '-', '--jq', '.sha'],
                  input=payload, stdout=subprocess.PIPE, check=True,
              ).stdout.decode().strip()
              assert sha == hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              entries.append({'name': str(file.relative_to('smoke')), 'sha': sha, 'size': len(data)})
          Path('.arena-smoke-debug.json').write_text(json.dumps(entries, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .arena-smoke-debug.json
          git commit -m 'Stage temporary emulator diagnostics'
          git push origin HEAD:arena/6801c5e3-react-native-lingua
