name: Temporary Android smoke diagnostics

on:
  push:
    branches:
      - "arena/85f2bc67-react-native-lingua"
    paths:
      - ".github/workflows/temporary-planning-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnostics:
    name: Retrieve failed emulator diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/85f2bc67-react-native-lingua
          fetch-depth: 0
      - name: Download emulator screenshots and logs
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-Android-Smoke
          path: .planning-diagnostics/smoke
          run-id: 44032616442
          github-token: ${{ github.token }}
      - name: Download upgrade screenshots and logs
        uses: actions/download-artifact@v4
        with:
          name: Planning-Upgrade-Diagnostics
          path: .planning-diagnostics/upgrade
          run-id: 44032656166
          github-token: ${{ github.token }}
      - name: Download available runner job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh run view 44032616442 --job 133874117694 --log > .planning-diagnostics/smoke-job.log; then
            echo 'Smoke job log is not available yet.'
            rm -f .planning-diagnostics/smoke-job.log
          fi
          if ! gh run view 44032656166 --job 133868026138 --log > .planning-diagnostics/upgrade-job.log; then
            echo 'Upgrade job log is not available yet.'
            rm -f .planning-diagnostics/upgrade-job.log
          fi
      - name: Stage diagnostics temporarily
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/85f2bc67-react-native-lingua
          git add .planning-diagnostics
          git commit -m 'Temporarily stage Android smoke diagnostics'
          git push origin HEAD:arena/85f2bc67-react-native-lingua
