name: Temporary native pronunciation check

on:
  push:
    branches:
      - "arena/85f2bc67-react-native-lingua"
    paths:
      - ".github/workflows/temporary-native-audio.yml"
      - "scripts/temporary-native-audio-check.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-audio:
    name: Verify offline Android playback and stop
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: artifacts
          run-id: 44017008826
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe actual playback with network disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/temporary-native-audio-check.py artifacts/Lingua-Demo.apk
      - name: Upload audio diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-Audio-Diagnostics
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 3
