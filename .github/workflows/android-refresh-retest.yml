name: Retest refreshed Android demo

# Temporary: validate the prior refresh build while the final rebuild runs.
on:
  push:
    branches: ["arena/6801c5e3-react-native-lingua"]
    paths: [".github/workflows/android-refresh-retest.yml"]

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    name: Retest refreshed lessons and study tools
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download refresh demo
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: new-apk
          run-id: 43778818666
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the refresh on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/smoke-android-demo.py new-apk/Lingua-Demo.apk
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Refresh-Retest-Diagnostics
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 3

  upgrade:
    name: Retest upgrade from shared study demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download previously shared study demo
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: old-apk
          run-id: 43715956070
          github-token: ${{ github.token }}
      - name: Download refresh demo
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: new-apk
          run-id: 43778818666
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade in place
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/smoke-android-upgrade-v2.py old-apk/Lingua-Demo.apk new-apk/Lingua-Demo.apk
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Refresh-Retest-Upgrade-Diagnostics
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 3
