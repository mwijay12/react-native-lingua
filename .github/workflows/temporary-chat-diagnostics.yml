name: Temporary Android keyboard trial

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/temporary-chat-diagnostics.yml"]

permissions:
  actions: read
  contents: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  build:
    name: Build disposable keyboard trial
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: original
          run-id: 44500708399
          github-token: ${{ github.token }}
      - name: Prepare isolated preview
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run harden-storage
          node scripts/prepare-android-demo.mjs
      - name: Bundle current JavaScript into a disposable APK
        env:
          EXPO_OFFLINE: "1"
          NODE_ENV: production
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trial-assets" trial
          cd .expo/android-demo
          ./node_modules/.bin/expo export:embed --platform android --entry-file node_modules/expo-router/entry.js --dev false --bundle-output "$RUNNER_TEMP/index.android.bundle" --assets-dest "$RUNNER_TEMP/trial-assets" --bytecode --max-workers 2
          cd ../..
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile('original/Lingua-Demo.apk') as source, zipfile.ZipFile(tmp / 'unsigned.apk', 'w') as target:
              assert 'assets/index.android.bundle' in source.namelist()
              for info in source.infolist():
                  upper = info.filename.upper()
                  if upper.startswith('META-INF/') and (upper.endswith(('.RSA', '.DSA', '.EC', '.SF')) or upper == 'META-INF/MANIFEST.MF'):
                      continue
                  content = (tmp / 'index.android.bundle').read_bytes() if info.filename == 'assets/index.android.bundle' else source.read(info)
                  target.writestr(info, content)
          PY
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/trial.jks" -alias trial -keyalg RSA -keysize 2048 -validity 2 -storepass android -keypass android -dname 'CN=Disposable emulator test' > /dev/null 2>&1
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/trial.jks" --ks-key-alias trial --ks-pass pass:android --key-pass pass:android --out trial/Lingua-Trial.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify trial/Lingua-Trial.apk
      - uses: actions/upload-artifact@v4
        with:
          name: internal-disposable-keyboard-trial
          path: trial/Lingua-Trial.apk
          retention-days: 1

  keyboard:
    name: Test chat with the Android keyboard open
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: internal-disposable-keyboard-trial
          path: trial
      - name: Create focused synthetic test
        run: |
          cat > "$RUNNER_TEMP/chat-trial.py" <<'PY'
          import importlib.util
          import time
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('smoke', 'scripts/smoke-android-demo.py')
          smoke = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(smoke)
          try:
              smoke.adb('install', '-r', 'trial/Lingua-Trial.apk')
              smoke.adb('shell', 'pm', 'clear', smoke.PACKAGE)
              smoke.adb('shell', 'svc', 'wifi', 'disable', check=False)
              smoke.adb('shell', 'svc', 'data', 'disable', check=False)
              smoke.adb('logcat', '-c')
              smoke.adb('shell', 'am', 'start', '-n', f'{smoke.PACKAGE}/.MainActivity')
              smoke.tap('Continue without an account', exact=True)
              smoke.wait_for('Choose a language')
              smoke.tap('Continue', exact=True)
              smoke.wait_for('TODAY’S STUDY')
              smoke.tap('Chat', exact=True)
              smoke.wait_for('AI connection needed')
              smoke.tap('Use prompt: Teach me a Kiswahili greeting', exact=True)
              smoke.wait_for('Teach me a Kiswahili greeting')
              smoke.tap('Change course, currently Kiswahili', exact=True)
              smoke.wait_for('Choosing a different course clears this conversation and draft.')
              smoke.tap('Keep', exact=True)
              smoke.tap('Message for the AI tutor', exact=True)
              smoke.wait_for('Send message', exact=True)
              time.sleep(2)
              smoke.screenshot('chat-keyboard-before-send')
              smoke.tap('Send message', exact=True)
              smoke.wait_for("AI chat isn't connected yet. Your draft is still here.")
              smoke.wait_for('Teach me a Kiswahili greeting')
              smoke.screenshot('chat-keyboard-after-send')
              smoke.adb('shell', 'input', 'keyevent', 'KEYCODE_BACK')
              smoke.tap('Clear conversation', exact=True)
              smoke.wait_for('Clear this conversation and draft?')
              smoke.tap('Clear', exact=True)
              smoke.wait_for('Use prompt: Teach me a Kiswahili greeting', exact=True)
              smoke.tap('Profile', exact=True)
              smoke.wait_for('About Lingua')
              print('Focused Android keyboard and draft test passed.', flush=True)
          finally:
              smoke.screenshot('chat-trial-last-screen')
              logs = smoke.adb('logcat', '-d', '-v', 'time', 'ReactNativeJS:V', 'AndroidRuntime:E', '*:S', check=False)
              (smoke.OUT / 'chat-trial-logcat.txt').write_bytes(logs.stdout)
          PY
      - name: Enable isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise disabled chat with the keyboard open
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -o pipefail -c 'python3 "$RUNNER_TEMP/chat-trial.py" 2>&1 | tee chat-trial.log'
      - name: Report synthetic test details
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          def notice(title, message):
              message = message[-9000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title={title}::{message}')
          for path in (Path('chat-trial.log'), Path('android-smoke/chat-trial-logcat.txt')):
              if path.exists():
                  lines = path.read_text(errors='replace').splitlines()
                  fatal = next((i for i, line in enumerate(lines) if 'FATAL EXCEPTION' in line), None)
                  notice(path.name, '\n'.join(lines[fatal:fatal+25] if fatal is not None else lines[-35:]))
          path = Path('android-smoke/last-window.xml')
          if path.exists():
              try:
                  labels = [f"{n.get('text', '')} | {n.get('content-desc', '')} | {n.get('bounds', '')}" for n in ET.parse(path).iter('node') if n.get('text') or n.get('content-desc')]
                  notice('Last synthetic screen', '\n'.join(labels[-40:]))
              except ET.ParseError:
                  pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-keyboard-trial-results
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 1

  prior:
    name: Inspect the previous synthetic failure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize completed job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/mwijay12/react-native-lingua/actions/jobs/135480017194/logs > job.log 2>/dev/null; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path('job.log').read_text(errors='replace').splitlines()
          selected = [line for line in lines if re.search(r'Found:|Tapped:|RuntimeError:|AssertionError:|Traceback|Did not find|Could not scroll', line)]
          message = '\n'.join(selected[-35:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::notice title=Previous smoke output::{message[-9000:] or "No matching lines"}')
          PY
          else
            echo '::notice title=Previous smoke output::Job log unavailable'
          fi
