name: Temporary Android motion retry

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/arena-motion-diagnostics.yml"]

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Prepare disposable trial APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Demo-APK
          path: original
          run-id: 44443156598
          github-token: ${{ github.token }}
      - name: Apply trial source and install existing dependencies
        run: |
          echo '' | base64 --decode | git apply
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run harden-storage
          node scripts/prepare-android-demo.mjs
      - name: Bundle trial JavaScript and re-sign disposable APK
        env:
          EXPO_OFFLINE: "1"
          NODE_ENV: production
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trial-assets" trial
          cd .expo/android-demo
          ./node_modules/.bin/expo export:embed --platform android --entry-file node_modules/expo-router/entry.js --dev false --bundle-output "$RUNNER_TEMP/index.android.bundle" --assets-dest "$RUNNER_TEMP/trial-assets" --bytecode --max-workers 2
          cd ../..
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile('original/Lingua-Demo.apk') as source, zipfile.ZipFile(tmp / 'unsigned.apk', 'w') as target:
              assert 'assets/index.android.bundle' in source.namelist()
              for info in source.infolist():
                  upper = info.filename.upper()
                  if upper.startswith('META-INF/') and (upper.endswith(('.RSA', '.DSA', '.EC', '.SF')) or upper == 'META-INF/MANIFEST.MF'):
                      continue
                  content = (tmp / 'index.android.bundle').read_bytes() if info.filename == 'assets/index.android.bundle' else source.read(info)
                  target.writestr(info, content)
          PY
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/trial.jks" -alias trial -keyalg RSA -keysize 2048 -validity 2 -storepass android -keypass android -dname 'CN=Disposable emulator test' > /dev/null 2>&1
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/trial.jks" --ks-key-alias trial --ks-pass pass:android --key-pass pass:android --out trial/Lingua-Trial.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify trial/Lingua-Trial.apk
      - uses: actions/upload-artifact@v4
        with:
          name: internal-disposable-motion-trial
          path: trial/Lingua-Trial.apk
          retention-days: 1

  motion:
    name: Trial normal and reduced motion
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply trial test updates
        run: echo '' | base64 --decode | git apply
      - uses: actions/download-artifact@v4
        with:
          name: internal-disposable-motion-trial
          path: trial
      - name: Enable isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run motion smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            bash -o pipefail -c 'LINGUA_SYNTHETIC_EMULATOR=1 python3 scripts/smoke-android-motion.py trial/Lingua-Trial.apk 2>&1 | tee motion-trial.log; result=${PIPESTATUS[0]}; adb logcat -d -v time ReactNativeJS:V AndroidRuntime:E "*:S" > android-smoke/trial-logcat.txt; exit "$result"'
      - name: Report trial details
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          def notice(title, message):
              message = message[-3800:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice title={title}::{message}')
          for path in (Path('motion-trial.log'), Path('android-smoke/trial-logcat.txt')):
              if path.exists():
                  lines = path.read_text(errors='replace').splitlines()
                  fatal = next((i for i,line in enumerate(lines) if 'FATAL EXCEPTION' in line), None)
                  notice(path.name, '\n'.join(lines[fatal:fatal+25] if fatal is not None else lines[-24:]))
          path = Path('android-smoke/last-window.xml')
          if path.exists():
              try:
                  labels = [f"{n.get('text', '')} | {n.get('content-desc', '')}" for n in ET.parse(path).iter('node') if n.get('text') or n.get('content-desc')]
                  notice('Trial last screen', '\n'.join(labels[-50:]))
              except ET.ParseError:
                  pass
          PY

  storage:
    name: Trial synthetic storage fault safety
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: internal-disposable-motion-trial
          path: trial
      - name: Enable isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run synthetic storage checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -o pipefail -c 'python3 scripts/smoke-android-storage-failures.py trial/Lingua-Trial.apk 2>&1 | tee storage-trial.log'
      - name: Report storage details
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in (Path('storage-trial.log'), Path('android-smoke/p0-storage-logcat.txt')):
              if path.exists():
                  lines = path.read_text(errors='replace').splitlines()
                  fatal = next((i for i,line in enumerate(lines) if 'FATAL EXCEPTION' in line), None)
                  message = '\n'.join(lines[fatal:fatal+25] if fatal is not None else lines[-24:])[-3800:]
                  message = message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print(f'::notice title=Trial {path.name}::{message}')
          PY

  screen:
    name: Inspect synthetic screen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: internal-motion-probe
          path: screens
          run-id: 44448604871
          github-token: ${{ github.token }}
      - name: Encode a small diagnostic screenshot
        run: |
          set -euo pipefail
          picture="$(find screens -name 'probe-last-screen.png' -print -quit)"
          test -n "$picture"
          cat > "$RUNNER_TEMP/Resize.java" <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.awt.Graphics2D;
          import java.io.File;
          import javax.imageio.ImageIO;
          import javax.imageio.ImageWriter;
          import javax.imageio.ImageWriteParam;
          import javax.imageio.IIOImage;
          import javax.imageio.stream.ImageOutputStream;
          public class Resize {
              public static void main(String[] args) throws Exception {
                  BufferedImage input = ImageIO.read(new File(args[0]));
                  int width = 260;
                  int height = input.getHeight() * width / input.getWidth();
                  BufferedImage output = new BufferedImage(width, height, BufferedImage.TYPE_INT_RGB);
                  Graphics2D g = output.createGraphics();
                  g.drawImage(input, 0, 0, width, height, null);
                  g.dispose();
                  ImageWriter writer = ImageIO.getImageWritersByFormatName("jpeg").next();
                  try (ImageOutputStream stream = ImageIO.createImageOutputStream(new File(args[1]))) {
                      writer.setOutput(stream);
                      ImageWriteParam p = writer.getDefaultWriteParam();
                      p.setCompressionMode(ImageWriteParam.MODE_EXPLICIT);
                      p.setCompressionQuality(0.25f);
                      writer.write(null, new IIOImage(output, null, null), p);
                  }
                  writer.dispose();
              }
          }
          JAVA
          java "$RUNNER_TEMP/Resize.java" "$picture" "$RUNNER_TEMP/screen.jpg"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          payload = base64.b64encode((Path(os.environ['RUNNER_TEMP']) / 'screen.jpg').read_bytes()).decode()
          chunks = [payload[index:index+3000] for index in range(0, len(payload), 3000)]
          if len(chunks) > 9:
              print(f'::error::Screenshot is too large ({len(chunks)} parts).')
              raise SystemExit(1)
          for index, part in enumerate(chunks):
              print(f'::notice title=screen image {index:02d}::{part}')
          PY
