name: Temporary Android input trial

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/arena-motion-diagnostics.yml"]

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: Probe normal-motion input
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: internal-disposable-motion-trial
          path: trial
          run-id: 44447786898
          github-token: ${{ github.token }}
      - name: Enable isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare careful input probe
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import importlib.util
          import os
          import time
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('motion', Path('scripts/smoke-android-motion.py'))
          motion = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(motion)
          os.environ['LINGUA_SYNTHETIC_EMULATOR'] = '1'
          smoke = motion.smoke
          def steady_tap(text, exact=False):
              smoke.wait_for(text, exact=exact)
              # Native transitions need time to settle before coordinates are
              # measured. Hold like a real tap rather than an instantaneous adb tap.
              time.sleep(0.7)
              _, _, x, y = smoke.wait_for(text, exact=exact)
              smoke.adb('shell', 'input', 'swipe', str(x), str(y), str(x), str(y), '120')
              print(f'Steady tap: {text} at {x},{y}', flush=True)
          smoke.tap = steady_tap
          try:
              motion.main(Path('trial/Lingua-Trial.apk'))
          finally:
              logs = smoke.adb('logcat', '-d', '-v', 'time', 'ReactNativeJS:V', 'AndroidRuntime:E', '*:S', check=False)
              (smoke.OUT / 'probe-logcat.txt').write_bytes(logs.stdout)
              smoke.screenshot('probe-last-screen')
          PY
      - name: Exercise motion modes on a fresh emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -o pipefail -c 'python3 "$RUNNER_TEMP/probe.py" 2>&1 | tee probe.log'
      - name: Report probe details
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          def notice(title, text):
              text = text[-3800:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice title={title}::{text}')
          for path in (Path('probe.log'), Path('android-smoke/probe-logcat.txt')):
              if path.exists():
                  lines = path.read_text(errors='replace').splitlines()
                  fatal = next((i for i,line in enumerate(lines) if 'FATAL EXCEPTION' in line), None)
                  notice(path.name, '\n'.join(lines[fatal:fatal+25] if fatal is not None else lines[-30:]))
          path = Path('android-smoke/last-window.xml')
          if path.exists():
              try:
                  labels = [f"{n.get('text', '')} | {n.get('content-desc', '')}" for n in ET.parse(path).iter('node') if n.get('text') or n.get('content-desc')]
                  notice('Last screen', '\n'.join(labels[-50:]))
              except ET.ParseError:
                  pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-motion-probe
          path: android-smoke/
          if-no-files-found: warn
          retention-days: 1
