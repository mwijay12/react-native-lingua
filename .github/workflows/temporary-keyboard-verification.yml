name: Temporary Android failure log inspection

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/temporary-keyboard-verification.yml"]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize synthetic failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/mwijay12/react-native-lingua/actions/jobs/136012395420/logs > build.log 2> build.err || true
          gh api --allow-escape-sequences repos/mwijay12/react-native-lingua/actions/jobs/135480017194/logs > smoke.log 2> smoke.err || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          ansi = re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          def clean(text):
              text = ansi.sub('', text)
              text = re.sub(r'(https?://[^/\s]+)\S*', r'\1/<redacted>', text)
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          def notice(title, text):
              print(f'::notice title={title}::{clean(text)[-11000:]}')
          lines = Path('build.log').read_text(errors='replace').splitlines()
          matches = [i for i, line in enumerate(lines) if re.search(r'FAILURE:|What went wrong:|Could not resolve|error:', line, re.I)]
          if matches:
              i = matches[-1]
              notice('Earlier Gradle failure', '\n'.join(lines[max(0, i-2):i+18]))
          else:
              notice('Earlier Gradle failure', Path('build.err').read_text(errors='replace') or f'No failure lines ({len(lines)} lines)')
          lines = Path('smoke.log').read_text(errors='replace').splitlines()
          selected = [line for line in lines if re.search(r'Found:|Tapped:|RuntimeError:|AssertionError:|Traceback|Did not find|Could not scroll', line)]
          notice('Earlier smoke failure', '\n'.join(selected[-45:]) or Path('smoke.err').read_text(errors='replace') or 'No matching lines')
          PY
