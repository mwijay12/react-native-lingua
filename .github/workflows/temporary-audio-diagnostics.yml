name: Temporary native audio diagnostics handoff

on:
  push:
    branches:
      - "arena/85f2bc67-react-native-lingua"
    paths:
      - ".github/workflows/temporary-audio-diagnostics.yml"

permissions:
  contents: write
  actions: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/85f2bc67-react-native-lingua
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Native-Audio-Diagnostics
          path: .native-audio-diagnostics
          run-id: 44019946516
          github-token: ${{ github.token }}
      - name: Temporarily stage emulator diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin arena/85f2bc67-react-native-lingua
          git add .native-audio-diagnostics
          git commit -m 'Temporarily stage native audio diagnostics'
          git push origin HEAD:arena/85f2bc67-react-native-lingua
